cceCn:
  label: Huawei CCE
  updateWarn: 集群正在升级，编辑可能导致未知错误
  region:
    label: 区域
    helpText: 获取区域参考<a href="https://developer.huaweicloud.com/endpoint" target="_blank">这里</a>。
    required: 区域必须填写
    cn_north_1: 华北-北京一
    cn_north_3: 华北三
    cn_north_4: 华北-北京四
    cn_east_3: 华东-上海一
    cn_east_2: 华东-上海二
    cn_south_1: 华南-广州
    cn_southwest_2: 西南-贵阳一
    ap_southeast_1: 中国-香港
    ap_southeast_2: 亚太-曼谷
    ap_southeast_3: 亚太-新加坡
    af_south_1: 非洲-约翰内斯堡
    sa_brazil_1: 拉美-圣保罗一
    la_south_2: 拉美-圣地亚哥
    cn_north_9: 华北-乌兰察布一
    eu_west_0: 欧洲-巴黎
    eu_west_101: 欧洲-都柏林
    tr_west_1: 土耳其-伊斯坦布尔
    ae_ad_1: 中东-阿布扎比-OP5
    ap_southeast_4: 亚太-雅加达
    ap_southeast_5: 亚太-马尼拉
    cn_south_4: 华南-广州-友好用户环境
    cn_north_11: 华北-乌兰察布-汽车一
    cn_east_5: 华东-青岛
    na_mexico_1: 拉美-墨西哥城一
    la_north_2: 拉美-墨西哥城二
    me_east_1: 中东-利雅得
    af_north_1: 非洲-开罗
    cn_east_4: 华东二
  clusterType:
    label: 集群类型
    VirtualMachine:
      label: 混合集群
    BareMetal:
      label: 裸金属集群
    ARM64:
      label: 鲲鹏集群
  version:
    label: 版本
    warningNotRecommend: “{version}”，此版本华为 CCE 不推荐使用。具体请查阅华为官方文档。
    warningRacher: “{version}”，此版本不在 Rancher 支持矩阵范围内。可参考
    warningRancherTip: Rancher 支持矩阵。
  managementScale:
    label: 集群管理规模
  containerNetworkMode:
    label: 网络模型
    none: 无配置
    overlay:
      label: 容器隧道网络
    underlayIpvlan:
      label: 'Underlay l2网络'
    vpcRouter:
      label: VPC网络
    eni:
      label: eni
  vpcId:
    label: 虚拟私有云
    default: 自动创建
    placeholder: 请选择一个 VPC
  subnetId:
    label: 所在子网
    none: 无可用子网
    default: 自动创建
    placeholder: 请选择一个子网
  containerNetworkCidr:
    label: 容器网段
    placeholder: '例如: 172.16.0.0/16'
    none: 无配置
    cidrFormatError: '"容器网段" 格式错误'
  eniNetworkCidr:
    label: Eni Network
    placeholder: 子网ID
  kubernetesSvcIPRange:
    label: 服务网段
    placeholder: '例如: 10.247.0.0/16'
    none: 无配置
    cidrFormatError: '"服务网段" 格式错误'
  securityGroup:
    label: 安全组
    required: 请选择安全组
    default: 默认安全组
  publicAccess:
    label: 使用公网访问
  kubeProxyMode:
    label: 服务转发模式
  eipSelection:
    none: 暂不使用
    new: 创建新的
    exist: 使用已有
  eipIds:
    label: 弹性 IP
    none: 无可用弹性 IP
    countError: 已选或新建的弹性 IP数量必须和节点数保持一致
  eipType:
    label: Eip 类型
    bgp: 全动态BGP
    sbgp: 静态BGP
  eipChargeMode:
    label: 计费模式
    bandwidth: 按带宽计费
    traffic: 按流量计费
  eipBandwidthSize:
    label: 带宽
  authentiactionMode:
    label: 证书认证
    rbac: 系统默认
    authenticating_proxy: 自定义
  authenticatingProxyCa:
    label: CA 根证书
  authenticatingProxyCert:
    label: 客户端证书
  authenticatingProxyPrivateKey:
    label: 客户端证书私钥
  highAvailability:
    label: 高可用
  availableZone:
    label: 当前区域
    value: 可用区{num}
    random: 随机
  nodePoolName:
    label: 节点池名称
    placeholder: 例如：nodepool
    required: 必须设置 worker 节点池名称
    same: 节点池名称不唯一
  billingMode:
    label: 计费模式
    payPerUse: 按需计费
    yearly: '包年/包月'
  rootVolumeType:
    label: 系统盘类型
  rootVolumeSize:
    label: 系统盘大小
    placeholder: "容量范围: 40 ~ 1024"
    minRequired: 磁盘大小必须大于等于 40 GB
  dataVolumeType:
    label: 数据盘类型
  dataVolumeSize:
    label: 数据盘大小
    placeholder: "容量范围: 100 ~ 32768"
    minRequired: 磁盘大小必须大于等于 100 GB
  volumetype:
    SAS: 高IO
    SSD: 超高IO
    SATA: 普通IO
    GPSSD: 通用SSD
    ESSD: 极速型SSD
    rootDescription: "系统盘取值范围: 40~1024 单位为GB"
    dataDescription: "数据盘取值范围: 100~32768 单位为GB"
  initialNodeCount:
    label: 节点个数
  flavor:
    label: 节点规格
  sshKey:
    label: 密钥对
  operatingSystem:
    label: 操作系统
  clusterSelect:
    importCluster: 集群
    required: 必须设置需要导入的集群
    placeholder: '请选择'
  validityPeriod:
    label: 有效期
  bmsIsAutoRenew:
    label: 自动续费
    months: |
      {count, plural,
        =1 {个月}
        other {个月}
      }
    years: |
      {count, plural,
        =1 {年}
        other {年}
      }
