name: Pandaria Tests
on:
  # push:
  #   branches:
  #     - 'release-*-cn*'
  pull_request:
    branches:
      - 'release-*-cn*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

env:
  # Build the dashboard to use in tests. When set to false it will grab `latest` from CDN (useful for running e2e tests quickly)
  BUILD_DASHBOARD: true


jobs:
  unit-test:
    runs-on: repo-dashboard-runner-k8s
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      
      - name: Run tests
        uses: ./.github/actions/unit-tests
  i18n:
    runs-on: repo-dashboard-runner-k8s
    container: ubuntu:22.04
    needs:
      - unit-test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Run i18n lint
        uses: ./.github/actions/i18n-lint
  lint:
    runs-on: repo-dashboard-runner-k8s
    container: ubuntu:22.04
    needs:
      - i18n
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - name: Run tests
        uses: ./.github/actions/lint
  check-i18n:
    runs-on: repo-dashboard-runner-k8s
    container: ubuntu:22.04
    needs:
      - lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
      - name: Install packages
        run: npm install --global yarn && yarn install:ci
      
      - name: Run i18n string check
        run: |
          # Falure won't fail the job (remove -x when all current issues are fixed)
          ./scripts/check-i18n -s -x

